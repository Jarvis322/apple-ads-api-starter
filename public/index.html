<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apple Ads Overview</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">APPLE ADS · API 5</p><h1>Campaign overview</h1><p id="account">Loading account…</p></div>
      <div class="filters"><label>Start<input id="start" type="date"></label><label>End<input id="end" type="date"></label><button id="refresh">Refresh</button></div>
    </header>
    <section id="notice" class="notice hidden"></section>
    <section id="totals" class="cards"></section>
    <section class="panel"><div class="panel-title"><div><p class="eyebrow">PERFORMANCE</p><h2>Campaigns</h2></div><span id="range"></span></div><div class="table-wrap"><table><thead><tr><th>Campaign</th><th>Impressions</th><th>Taps</th><th>Installs</th><th>Spend</th><th>Avg. CPT</th><th>CPI</th><th>TTR</th></tr></thead><tbody id="reports"></tbody></table></div></section>
    <section class="panel"><div class="panel-title"><div><p class="eyebrow">STRUCTURE</p><h2>Campaign data</h2></div><span>Open a campaign to inspect its ad groups and keywords</span></div><div id="campaigns" class="campaigns"></div></section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
