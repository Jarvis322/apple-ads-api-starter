name: Feature request
description: Suggest an improvement to the starter or optimizer roadmap.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include links to current official Apple documentation when relevant.
    validations:
      required: true
